<app-page-header
  title="Finaliza tu compra"
  subtitle="Verifica los datos de pago para confirmar tus entradas con reserva activa.">
</app-page-header>

<div class="checkout-layout">
  <mat-card class="checkout-card">
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="grid">
          <mat-form-field appearance="outline">
            <mat-label>Nombre completo</mat-label>
            <input matInput formControlName="name" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Email</mat-label>
            <input matInput type="email" formControlName="email" />
          </mat-form-field>

          <mat-form-field appearance="outline" class="full">
            <mat-label>Número de tarjeta</mat-label>
            <input matInput formControlName="card" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Expiración</mat-label>
            <input matInput formControlName="expiration" placeholder="MM/AA" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>CVV</mat-label>
            <input matInput formControlName="cvv" />
          </mat-form-field>
        </div>

        <button mat-flat-button color="primary" type="submit" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Procesando pago...' : 'Pagar ahora' }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>

  <app-cart title="Resumen del pedido"></app-cart>
</div>
