<mat-card>
  <mat-card-content>
    <mat-card-title>Slider</mat-card-title>
    <mat-card-subtitle>mat-slider allows for the selection of a value from a range via mouse, touch, or keyboard, similar to
      <code class=""><a href="https://material.angular.io/components/slider/overview">Official Component</a></code>
    </mat-card-subtitle>

    <h4 class="m-b-0">Basic Slider</h4>
    <mat-slider>
      <input matSliderThumb value="40">
    </mat-slider>

    <h4 class="m-b-0">Value Slider</h4>
    <mat-slider [min]="min" [max]="max" [step]="step">
      <input matSliderThumb [value]="val">
    </mat-slider>

    <h4 class="m-b-0">With Min and Max</h4>
    <mat-form-field>
      <input [(ngModel)]="min" matInput> </mat-form-field>
    <mat-form-field>
      <input [(ngModel)]="max" matInput>
    </mat-form-field>
    <br/>
    <mat-slider [min]="min" [max]="max" [step]="step" [discrete]="thumbLabel" [showTickMarks]="showTicks">
      <input matSliderThumb [value]="demo">
    </mat-slider>
  </mat-card-content>
</mat-card>

<mat-card>
  <mat-card-content>
    <h5 class="example-h2">Slider configuration</h5>

    <section class="example-section">
      <mat-form-field class="example-margin">
        <input matInput type="number" placeholder="Value" [(ngModel)]="value">
      </mat-form-field>
      <mat-form-field class="example-margin">
        <input matInput type="number" placeholder="Min value" [(ngModel)]="min">
      </mat-form-field>
      <mat-form-field class="example-margin">
        <input matInput type="number" placeholder="Max value" [(ngModel)]="max">
      </mat-form-field>
      <mat-form-field class="example-margin">
        <input matInput type="number" placeholder="Step size" [(ngModel)]="step">
      </mat-form-field>
    </section>

    <section class="example-section">
      <mat-checkbox class="example-margin" [(ngModel)]="showTicks">Show ticks</mat-checkbox>
      <mat-checkbox class="example-margin" [(ngModel)]="thumbLabel">Discrete label</mat-checkbox>
      <mat-checkbox class="example-margin" [(ngModel)]="disabled">Disabled</mat-checkbox>
    </section>

  </mat-card-content>
</mat-card>

<mat-card class="result">
  <mat-card-content>
    <h5 class="example-h2">Result</h5>

    <mat-slider
      class="example-margin"
      [disabled]="disabled"
      [max]="max"
      [min]="min"
      [step]="step"
      [discrete]="thumbLabel"
      [showTickMarks]="showTicks">
      <input matSliderThumb [value]="value">
    </mat-slider>
  </mat-card-content>
</mat-card>
