<mat-card>
  <mat-card-content>
    <h3 class="example-h2">Radio Button configuration</h3>

    <mat-radio-group class="example-radio-group" [(ngModel)]="favoriteSeason">
      @for (season of seasons; track season) {
        <mat-radio-button class="example-radio-button" [value]="season">
          {{season}}
        </mat-radio-button>
      }
    </mat-radio-group>
    <div class="example-selected-value">Your favorite season is: {{favoriteSeason}}</div>

  </mat-card-content>
</mat-card>
