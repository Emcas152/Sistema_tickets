<mat-card>
  <mat-card-content>
    <mat-card-title>Editable table</mat-card-title>
    <ngx-datatable #mydatatable class="material" [headerHeight]="50" [limit]="5" [columnMode]="'force'" [footerHeight]="50" [rowHeight]="'auto'"
      [rows]="rows">
      <ngx-datatable-column name="Name">
        <ng-template ngx-datatable-cell-template let-rowIndex="rowIndex" let-value="value" let-row="row">
          @if (!editing[rowIndex + '-name']) {
            <span title="Double click to edit" (dblclick)="editing[rowIndex + '-name'] = true">
              {{value}}
            </span>
          }
          @if (editing[rowIndex+ '-name']) {
            <input autofocus (blur)="updateValue($event, 'name', rowIndex)" type="text" [value]="value"
              />
          }
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column name="Gender">
        <ng-template ngx-datatable-cell-template let-rowIndex="rowIndex" let-row="row" let-value="value">
          @if (!editing[rowIndex + '-gender']) {
            <span title="Double click to edit" (dblclick)="editing[rowIndex + '-gender'] = true">
              {{value}}
            </span>
          }
          @if (editing[rowIndex + '-gender']) {
            <select (change)="updateValue($event, 'gender', rowIndex)" [value]="value">
              <option value="male">Male</option>
              <option value="female">Female</option>
            </select>
          }
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column name="Age">
        <ng-template ngx-datatable-cell-template let-value="value">
          {{value}}
        </ng-template>
      </ngx-datatable-column>
    </ngx-datatable>
  </mat-card-content>
</mat-card>
